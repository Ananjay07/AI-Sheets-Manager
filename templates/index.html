<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheet Intelligence | AI-Powered Data</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #ec4899;
            --bg: #09090b;
            --card-bg: rgba(24, 24, 27, 0.7);
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            overflow-x: hidden;
        }

        /* Animated Aura Background */
        .aura {
            position: fixed;
            width: 60vw;
            height: 60vw;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            opacity: 0.2;
            animation: move 20s infinite alternate ease-in-out;
        }

        .aura-1 {
            background: var(--primary);
            top: -20%;
            left: -10%;
        }

        .aura-2 {
            background: var(--secondary);
            bottom: -10%;
            right: -10%;
            animation-delay: -5s;
        }

        @keyframes move {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(15%, 15%) scale(1.1);
            }
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            height: calc(100vh - 4rem);
        }

        /* Left Panel: Data & Form */
        .main-panel {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        /* Form Styles */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 120px 150px;
            gap: 1rem;
            align-items: end;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            color: white;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.5);
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        /* Table Styles */
        .data-table-container {
            flex-grow: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th {
            text-align: left;
            padding: 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .score-badge {
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* Right Panel: AI Chat */
        .ai-panel {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            background: rgba(24, 24, 27, 0.4);
            border-radius: 24px;
            overflow: hidden;
        }

        .ai-header {
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .ai-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .msg {
            max-width: 85%;
            padding: 1rem;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .msg-ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .msg-user {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-input-area {
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 0.75rem;
        }

        #chat-input {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            color: white;
        }

        .btn-send {
            background: var(--text-main);
            color: black;
            border: none;
            width: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Loader */
        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 1000px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
                height: auto;
            }

            .ai-panel {
                height: 600px;
            }
        }
    </style>
</head>

<body>
    <div class="aura aura-1"></div>
    <div class="aura aura-2"></div>

    <div class="dashboard-grid">
        <!-- Main Content (Left) -->
        <div class="main-panel">
            <header class="header">
                <h1>Sheet Intelligence</h1>
                <p style="color: var(--text-muted)">Real-time AI management for Google Sheets</p>
            </header>

            <!-- Quick Add Form -->
            <div class="glass-card">
                <form action="/submit" method="POST" class="form-row">
                    <div class="input-group">
                        <label>Name</label>
                        <input type="text" name="name" placeholder="John Doe" required>
                    </div>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" name="email" placeholder="john@example.com" required>
                    </div>
                    <div class="input-group">
                        <label>Score</label>
                        <input type="number" name="score" placeholder="100" required>
                    </div>
                    <button type="submit" class="btn-submit">Add Entry</button>
                </form>
            </div>

            <!-- Data Table -->
            <div class="glass-card data-table-container">
                <div style="display: flex; justify-content: space-between; align-items: center">
                    <h3 style="font-weight: 700">Spreadsheet Rows</h3>
                    <button onclick="fetchData()"
                        style="background: none; border: none; color: var(--primary); cursor: pointer; font-weight: 600">Refresh</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>NAME</th>
                            <th>EMAIL</th>
                            <th>SCORE</th>
                        </tr>
                    </thead>
                    <tbody id="data-body">
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- AI Panel (Right) -->
        <div class="ai-panel">
            <div class="ai-header">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary)">
                    <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
                    <path d="M12 12L2.1 12"></path>
                    <path d="M12 12L22 12"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <h2>AI Insights</h2>
            </div>

            <div class="chat-messages" id="chat-messages">
                <div class="msg msg-ai">
                    Hello! I'm your Sheet Intelligence assistant. You can ask me to analyze data, update scores (via
                    email), or add new users. How can I help?
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Update John's score to 85...">
                <button class="btn-send" onclick="sendMessage()" id="send-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Fetch SpreadSheet Data
        async function fetchData() {
            const tbody = document.getElementById('data-body');
            try {
                const response = await fetch('/api/get-users/');
                const result = await response.json();

                tbody.innerHTML = '';
                // Skip header row if it exists
                const data = result.data.length > 0 && isHeader(result.data[0]) ? result.data.slice(1) : result.data;

                data.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight: 500">${row[0] || '-'}</td>
                        <td style="color: var(--text-muted)">${row[1] || '-'}</td>
                        <td><span class="score-badge">${row[2] || '0'}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Fetch error:', error);
            }
        }

        function isHeader(row) {
            return row[0].toLowerCase() === 'name';
        }

        // AI Chat Functionality
        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const container = document.getElementById('chat-messages');
            const btn = document.getElementById('send-btn');
            const message = input.value.trim();

            if (!message) return;

            // Add user message
            appendMessage(message, 'user');
            input.value = '';

            // Add thinking state
            btn.innerHTML = '<div class="loader"></div>';
            btn.disabled = true;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const result = await response.json();

                // Ensure we have a valid response string
                const aiResponse = result.response || result.detail || "I'm sorry, I received an invalid response format from the server.";
                appendMessage(aiResponse, 'ai');

                // Refresh data in case LLM made changes
                fetchData();
            } catch (error) {
                appendMessage('Sorry, I encountered a network error connecting to the LLM.', 'ai');
            } finally {
                btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>';
                btn.disabled = false;
            }
        }

        function appendMessage(text, side) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `msg msg-${side}`;
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // Initial Load
        window.onload = fetchData;

        // Enter to send
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>

</html>
